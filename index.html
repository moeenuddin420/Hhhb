<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download G-ZONE</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #0f172a; color: white; font-family: 'Rajdhani', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; }
        .logo { width: 120px; height: 120px; border-radius: 25px; margin-bottom: 20px; box-shadow: 0 0 40px rgba(6, 182, 212, 0.4); border: 2px solid rgba(255,255,255,0.1); }
        h1 { margin: 0; font-size: 3rem; color: #fff; text-shadow: 0 0 20px #06b6d4; }
        p { color: #94a3b8; max-width: 300px; margin-top: 10px; line-height: 1.5; }
        
        /* The Install Button - Hidden by default */
        #installBtn {
            display: none; /* Only shows if browser allows it */
            margin-top: 30px;
            padding: 15px 40px;
            background: linear-gradient(135deg, #06b6d4, #3b82f6);
            border: none; border-radius: 50px;
            color: white; font-size: 1.2rem; font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.5);
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        
        .footer { position: absolute; bottom: 30px; color: #64748b; font-size: 0.8rem; }
    </style>
</head>
<body>

    <img src="https://cdn-icons-png.flaticon.com/512/3233/3233483.png" class="logo">
    <h1>G-ZONE</h1>
    <p>The Ultimate Esports Platform. Install the app to play & earn.</p>

    <!-- NATIVE INSTALL BUTTON -->
    <button id="installBtn">INSTALL APP</button>

    <div class="footer">Secure & Verified v2.1</div>

    <script>
        // 1. Redirect if already in App Mode
        if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
            window.location.href = 'app.html';
        }

        // 2. Register Service Worker (Required for PWA Install)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js');
        }

        // 3. Handle Native Install Prompt
        let deferredPrompt;
        const btn = document.getElementById('installBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            // Prevent Chrome 67 and earlier from automatically showing the prompt
            e.preventDefault();
            // Stash the event so it can be triggered later.
            deferredPrompt = e;
            // Update UI to notify the user they can add to home screen
            btn.style.display = 'block';
        });

        btn.addEventListener('click', (e) => {
            // Show the prompt
            if (deferredPrompt) {
                deferredPrompt.prompt();
                // Wait for the user to respond to the prompt
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('User accepted the A2HS prompt');
                        btn.style.display = 'none';
                    } else {
                        console.log('User dismissed the A2HS prompt');
                    }
                    deferredPrompt = null;
                });
            }
        });
    </script>
</body>
</html>
