<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>G-ZONE ESPORTS</title>
    <meta name="theme-color" content="#0f172a">
    
    <!-- FONTS -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Rajdhani:wght@500;600;700&family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- 🎨 PREMIUM GLASS THEME --- */
        :root { 
            --bg-dark: #0f172a; 
            --glass: rgba(30, 41, 59, 0.7); 
            --primary: #06b6d4; 
            --glow: 0 0 20px rgba(6, 182, 212, 0.4);
            --border: rgba(255, 255, 255, 0.1); 
            --text: #f8fafc; 
            --font-bn: 'Hind Siliguri', sans-serif; 
            --font-en: 'Rajdhani', sans-serif; 
        }

        * { box-sizing: border-box; margin:0; padding:0; -webkit-tap-highlight-color: transparent; outline: none; }
        body { background: var(--bg-dark); color: var(--text); font-family: var(--font-bn); padding-bottom: 80px; background-image: radial-gradient(circle at 50% 0%, rgba(6,182,212,0.15), transparent 70%); min-height: 100vh; overflow-x: hidden; }
        .hidden { display: none !important; }
        
        /* UI COMPONENTS */
        .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; transition: 0.2s; backdrop-filter: blur(5px); font-family: var(--font-bn); }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: linear-gradient(135deg, var(--primary), #3b82f6); color: white; box-shadow: var(--glow); border: 1px solid rgba(255,255,255,0.1); }
        .btn-secondary { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: white; }
        
        .input-group { position: relative; margin-bottom: 12px; }
        .input-group i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--primary); }
        input, select { width: 100%; padding: 14px 14px 14px 45px; background: rgba(15,23,42,0.6); border: 1px solid var(--border); border-radius: 12px; color: white; font-family: inherit; font-size: 1rem; }
        input:focus { border-color: var(--primary); box-shadow: var(--glow); }

        /* HEADER */
        header { padding: 15px 20px; background: rgba(15,23,42,0.9); backdrop-filter: blur(15px); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); box-shadow: 0 5px 20px rgba(0,0,0,0.3); }
        .logo { font-family: var(--font-en); font-size: 1.6rem; font-weight: 800; color: white; text-shadow: 0 0 10px rgba(255,255,255,0.2); } 
        .logo span { color: var(--primary); }
        .nav-balance { background: rgba(6,182,212,0.15); padding: 6px 14px; border-radius: 50px; border: 1px solid rgba(6,182,212,0.3); display: flex; align-items: center; gap: 6px; font-family: var(--font-en); font-weight: 700; color: var(--primary); cursor: pointer; }
        
        /* DRAWER */
        .drawer-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 998; display: none; backdrop-filter: blur(5px); }
        .drawer { position: fixed; top: 0; left: 0; width: 280px; height: 100%; background: #0f172a; z-index: 999; transform: translateX(-100%); transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .drawer.open { transform: translateX(0); }
        .drawer-header { padding: 30px 20px; background: linear-gradient(to bottom, #1e293b, #0f172a); display: flex; align-items: center; gap: 15px; border-bottom: 1px solid var(--border); }
        .d-user-img { width: 55px; height: 55px; border-radius: 50%; border: 2px solid var(--primary); padding: 2px; box-shadow: var(--glow); }
        .drawer-items { padding: 15px; overflow-y: auto; flex: 1; }
        .d-item { padding: 14px; display: flex; align-items: center; gap: 15px; color: #94a3b8; border-radius: 10px; margin-bottom: 5px; transition: 0.2s; }
        .d-item:active { background: rgba(255,255,255,0.05); color: white; }
        .d-item i { width: 25px; text-align: center; color: var(--primary); }

        /* CARDS & PAGES */
        .page-section { display: none; padding-top: 15px; animation: fadeIn 0.3s; } .page-section.active { display: block; } 
        @keyframes fadeIn { from {opacity:0; transform:translateY(10px);} to {opacity:1; transform:translateY(0);} }
        .t-card { background: var(--glass); border: 1px solid var(--border); border-radius: 16px; margin: 0 16px 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .t-body { padding: 18px; } .t-title { font-family: var(--font-en); font-size: 1.3rem; font-weight: 700; color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .t-img-wrap { height: 160px; position: relative; } .t-img { width: 100%; height: 100%; object-fit: cover; }
        .t-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; background: rgba(0,0,0,0.3); padding: 12px; border-radius: 12px; text-align: center; margin: 15px 0; border: 1px solid rgba(255,255,255,0.05); }
        .t-stats small { display: block; color: #94a3b8; font-size: 0.75rem; text-transform: uppercase; } .t-stats b { color: var(--primary); font-family: var(--font-en); font-size: 1.1rem; }
        
        /* SPIN WHEEL */
        .wheel-container { position: relative; width: 280px; height: 280px; margin: 0 auto; }
        .wheel { width: 100%; height: 100%; border-radius: 50%; background: conic-gradient(#ef4444 0deg 90deg, #10b981 90deg 180deg, #3b82f6 180deg 270deg, #f59e0b 270deg 360deg); transition: transform 4s ease-out; border: 5px solid #1e293b; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
        .wheel-pointer { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 35px solid white; z-index: 2; filter: drop-shadow(0 4px 4px rgba(0,0,0,0.5)); }
        
        /* MISC */
        #loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f172a; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .loader { width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.1); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; box-shadow: var(--glow); } @keyframes spin { 100% { transform: rotate(360deg); } }
        #toast-box { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1e293b; border: 1px solid var(--primary); padding: 12px 25px; border-radius: 50px; z-index: 3000; display: none; white-space: nowrap; box-shadow: 0 10px 40px rgba(0,0,0,0.5); font-weight: bold; }
        .modal { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:1500; display:flex; align-items:center; justify-content:center; backdrop-filter: blur(5px); } 
        .modal-content { background: #1e293b; width: 90%; max-width: 350px; padding: 25px; border-radius: 20px; border: 1px solid var(--primary); box-shadow: 0 0 50px rgba(6, 182, 212, 0.2); }
    </style>
</head>
<body>

    <!-- LOADING -->
    <div id="loading-overlay"><div class="loader"></div></div>
    <div id="toast-box"></div>

    <!-- AUTH -->
    <div id="auth-container" class="hidden" style="padding:30px; height:100vh; display:flex; flex-direction:column; justify-content:center; text-align:center;">
        <h1 class="logo" style="font-size:3rem; margin-bottom:10px;">G-ZONE <span>ESPORTS</span></h1>
        <p style="color:#94a3b8; margin-bottom:40px;">Play & Earn Money</p>
        <div id="login-form">
            <div class="input-group"><i class="fas fa-envelope"></i><input type="email" id="l-email" placeholder="Email"></div>
            <div class="input-group"><i class="fas fa-lock"></i><input type="password" id="l-pass" placeholder="Password"></div>
            <button class="btn btn-primary" onclick="window.login()">LOGIN</button>
            <p style="margin-top:20px; color:#94a3b8; font-size:0.9rem; cursor:pointer;" onclick="window.toggleAuth()">Create Account</p>
        </div>
        <div id="signup-form" class="hidden">
            <div class="input-group"><i class="fas fa-user"></i><input type="text" id="r-user" placeholder="Full Name"></div>
            <div class="input-group"><i class="fas fa-envelope"></i><input type="email" id="r-email" placeholder="Email"></div>
            <div class="input-group"><i class="fas fa-lock"></i><input type="password" id="r-pass" placeholder="Password"></div>
            <div class="input-group"><i class="fas fa-gift"></i><input type="text" id="r-refer" placeholder="Refer Code (Optional)"></div>
            <button class="btn btn-primary" onclick="window.register()">REGISTER</button>
            <p style="margin-top:20px; color:#94a3b8; font-size:0.9rem; cursor:pointer;" onclick="window.toggleAuth()">Login</p>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="app-container" class="hidden">
        <header>
            <div style="display:flex; align-items:center; gap:15px;"><i class="fas fa-bars" onclick="window.toggleDrawer()" style="color:white; font-size:1.3rem; cursor:pointer;"></i> <div class="logo" style="font-size:1.4rem;">G-ZONE</div></div>
            <div class="nav-balance" onclick="window.nav('page-withdraw')"><i class="fas fa-wallet"></i>৳<span id="header-bal">0</span></div>
        </header>

        <!-- HOME -->
        <div id="page-home" class="page-section active">
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:15px 16px;">
                <div class="btn btn-secondary" style="background:rgba(6,182,212,0.1); border-color:var(--primary);" onclick="window.nav('page-add-money')"><i class="fas fa-plus-circle" style="color:var(--primary)"></i> Add Money</div>
                <div class="btn btn-secondary" style="background:rgba(245,158,11,0.1); border-color:var(--warning);" onclick="window.nav('page-withdraw')"><i class="fas fa-arrow-down" style="color:var(--warning)"></i> Withdraw</div>
            </div>
            <div id="banner-slider" style="margin: 0 16px 20px; height:160px; border-radius:16px; overflow:hidden;"></div>
            <div id="tournament-list"></div>
        </div>

        <!-- MATCHES -->
        <div id="page-matches" class="page-section"><h3 style="margin:0 16px 15px; color:var(--primary);">My Matches</h3><div id="my-matches-list"></div></div>
        
        <!-- SPIN -->
        <div id="page-spin" class="page-section">
            <div class="t-card"><div class="t-body" style="text-align:center;">
                <div class="wheel-container"><div class="wheel-pointer"></div><div id="spin-wheel" class="wheel"></div></div>
                <div style="margin-top:20px; background:rgba(239,68,68,0.1); padding:10px; border-radius:10px; font-size:0.85rem; color:#fca5a5; border:1px solid rgba(239,68,68,0.3);">Warning: Play at your own risk.</div>
                <div class="input-group" style="margin-top:20px;"><i class="fas fa-coins"></i><input type="number" id="spin-amt" placeholder="Enter Amount"></div>
                <button class="btn btn-primary" id="spin-btn" onclick="window.spinWheel()">SPIN NOW</button>
            </div></div>
        </div>

        <!-- WALLET -->
        <div id="page-withdraw" class="page-section">
            <div class="t-card"><div class="t-body">
                <h3 style="margin-bottom:15px; color:var(--primary);">Withdraw Funds</h3>
                <div class="input-group"><i class="fas fa-university"></i>
                <select id="w-method" style="padding-left:45px;">
                    <option value="Bkash">Bkash</option><option value="Nagad">Nagad</option><option value="Niva Coin">Niva Coin</option>
                </select></div>
                <div class="input-group"><i class="fas fa-coins"></i><input type="number" id="w-amt" placeholder="Amount"></div>
                <div class="input-group"><i class="fas fa-phone"></i><input type="text" id="w-num" placeholder="Wallet Number"></div>
                <button class="btn btn-primary" onclick="window.doWithdraw()">WITHDRAW REQUEST</button>
            </div></div>
        </div>

        <!-- PROFILE -->
        <div id="page-profile" class="page-section">
            <div class="t-card"><div class="t-body" style="text-align:center;">
                <img id="p-pic" src="" style="width:90px; height:90px; border-radius:50%; border:3px solid var(--primary); box-shadow:var(--glow);">
                <h2 id="p-name" style="margin:10px 0 5px; color:white;">...</h2>
                <div style="background:rgba(0,0,0,0.3); padding:5px 15px; border-radius:20px; display:inline-block; font-family:monospace; color:var(--primary);" id="p-custom-id">...</div>
                <div style="margin-top:20px; text-align:left;">
                     <small style="color:#94a3b8;">Referral Code</small>
                     <div style="display:flex; justify-content:space-between; background:rgba(0,0,0,0.3); padding:12px; border-radius:10px; margin-top:5px; border:1px solid var(--border);">
                         <span id="my-refer-code" style="font-weight:bold; color:var(--success); font-family:monospace; font-size:1.2rem;">...</span>
                         <i class="fas fa-copy" style="color:white; cursor:pointer;" onclick="window.copyReferCode()"></i>
                     </div>
                </div>
            </div></div>
        </div>
    </div>

    <!-- DRAWER -->
    <div class="drawer-overlay" onclick="window.toggleDrawer()"></div>
    <div class="drawer">
        <div class="drawer-header"><img id="d-pic" src="" class="d-user-img"><div style="color:white;"><div id="d-name" style="font-weight:bold;">...</div><small id="d-uid" style="color:#94a3b8; font-family:monospace;">...</small></div></div>
        <div class="drawer-items">
            <div class="d-item" onclick="window.nav('page-home')"><i class="fas fa-home"></i> Home</div>
            <div class="d-item" onclick="window.nav('page-matches')"><i class="fas fa-gamepad"></i> My Matches</div>
            <div class="d-item" onclick="window.nav('page-spin')"><i class="fas fa-dharmachakra"></i> Spin Wheel</div>
            <div class="d-item" onclick="window.nav('page-withdraw')"><i class="fas fa-wallet"></i> Wallet</div>
            <div class="d-item" onclick="window.nav('page-profile')"><i class="fas fa-user"></i> Profile</div>
        </div>
        <div class="drawer-footer"><div class="d-item" onclick="window.logout()" style="color:var(--danger); border:1px solid var(--danger); justify-content:center;"><i class="fas fa-sign-out-alt" style="color:var(--danger)"></i> Logout</div></div>
    </div>

    <!-- MODALS -->
    <div id="join-modal" class="hidden modal"><div class="modal-content"><h3 style="color:white; margin-bottom:10px;">Join Match</h3><p id="j-fee" style="color:var(--warning); margin-bottom:15px; font-weight:bold;">Fee: 0</p><div class="input-group"><i class="fas fa-gamepad"></i><input id="j-uid" placeholder="Game UID/Name"></div><button class="btn btn-primary" onclick="window.confirmJoin()">CONFIRM JOIN</button><button class="btn btn-secondary" style="margin-top:10px;" onclick="window.closeJoin()">CANCEL</button></div></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, collection, query, where, orderBy, addDoc, increment, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyAafXkJwyZ5F7Xuax0VktZ9cpqWD4oCvxU", authDomain: "tournament-97743.firebaseapp.com", projectId: "tournament-97743", messagingSenderId: "584797187828", appId: "1:584797187828:web:4c643f83dfd9b700adb8a1" };
        const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);

        let currentUser = null; let selMatch = null;
        const $ = (id) => document.getElementById(id);

        // --- AUTH ---
        onAuthStateChanged(auth, user => {
            $('loading-overlay').classList.add('hidden');
            if(user) {
                $('auth-container').classList.add('hidden'); $('app-container').classList.remove('hidden');
                onSnapshot(doc(db,"users",user.uid), d=>{
                    if(d.exists()){
                        currentUser = d.data();
                        $('header-bal').innerText = currentUser.balance;
                        $('p-name').innerText = currentUser.fullName; $('d-name').innerText = currentUser.fullName;
                        $('p-custom-id').innerText = currentUser.customId; $('d-uid').innerText = "ID: "+currentUser.customId;
                        $('my-refer-code').innerText = currentUser.referralCode;
                        const pic = currentUser.photoURL || "https://via.placeholder.com/100";
                        $('p-pic').src = pic; $('d-pic').src = pic;
                        loadMatches(); loadMyMatches(user.uid);
                    }
                });
            } else {
                $('app-container').classList.add('hidden'); $('auth-container').classList.remove('hidden');
            }
        });

        // --- GLOBAL WINDOW FUNCTIONS (FIXED) ---
        window.login = async() => { try { await signInWithEmailAndPassword(auth, $('l-email').value, $('l-pass').value); } catch(e){ alert("Error: "+e.message); } };
        window.register = async() => {
            const name=$('r-user').value, email=$('r-email').value, pass=$('r-pass').value;
            try {
                const c = await createUserWithEmailAndPassword(auth, email, pass);
                const uid = c.user.uid; const randId = Math.floor(100000+Math.random()*900000).toString();
                await setDoc(doc(db,"users",uid), { fullName:name, email, balance:0, customId:randId, referralCode: "REF"+randId.substr(0,4), totalRefers:0, referEarn:0 });
            } catch(e){ alert("Error: "+e.message); }
        };
        window.logout = () => signOut(auth);
        window.toggleAuth = () => { $('login-form').classList.toggle('hidden'); $('signup-form').classList.toggle('hidden'); };
        
        window.nav = (page) => {
            document.querySelectorAll('.page-section').forEach(e=>e.classList.remove('active'));
            $(page).classList.add('active');
            const drawer = document.querySelector('.drawer');
            if(drawer.style.transform==='translateX(0px)') window.toggleDrawer();
        };
        window.toggleDrawer = () => { const d=document.querySelector('.drawer'), o=document.querySelector('.drawer-overlay'); if(d.style.transform==='translateX(0px)'){d.style.transform='translateX(-100%)';o.style.display='none';}else{d.style.transform='translateX(0px)';o.style.display='block';} };

        // --- MATCHES ---
        function loadMatches() {
            onSnapshot(collection(db,"tournaments"), s => {
                $('tournament-list').innerHTML = '';
                s.forEach(doc => {
                    const t = doc.data();
                    const btn = t.joined>=t.total ? `<button class="btn btn-secondary" disabled>FULL</button>` : `<button class="btn btn-primary" onclick="window.openJoin('${doc.id}', ${t.fee})">JOIN</button>`;
                    $('tournament-list').innerHTML += `
                        <div class="t-card">
                            <div class="t-img-wrap"><img src="${t.image||'https://via.placeholder.com/300'}" class="t-img"><div class="t-type-badge">${t.type}</div><div class="t-overlay"><div class="t-title">${t.title}</div></div></div>
                            <div class="t-body"><div class="t-stats"><small>Fee</small><b>৳${t.fee}</b></div><div class="t-stats"><small>Slots</small><b>${t.joined}/${t.total}</b></div><div class="t-stats"><small>Map</small><b>${t.category}</b></div><div class="t-actions">${btn}</div></div>
                        </div>`;
                });
            });
        }

        window.openJoin = (id, fee) => { selMatch={id, fee}; $('join-modal').classList.remove('hidden'); $('j-fee').innerText = "Fee: "+fee; };
        window.closeJoin = () => $('join-modal').classList.add('hidden');
        
        window.confirmJoin = async() => {
            const uid = $('j-uid').value;
            if(currentUser.balance < selMatch.fee) return alert("Low Balance");
            await updateDoc(doc(db,"users",auth.currentUser.uid), {balance: increment(-selMatch.fee)});
            await updateDoc(doc(db,"tournaments",selMatch.id), {joined: increment(1)});
            await addDoc(collection(db,`users/${auth.currentUser.uid}/matches`), {tourneyId: selMatch.id, uid: uid});
            alert("Joined!"); window.closeJoin(); window.nav('page-matches');
        };

        function loadMyMatches(uid) {
            onSnapshot(collection(db,`users/${uid}/matches`), s => {
                $('my-matches-list').innerHTML = s.empty ? "<p style='text-align:center; color:#94a3b8;'>No matches joined.</p>" : "";
                s.forEach(async d => {
                    const m = d.data();
                    const tSnap = await getDoc(doc(db,"tournaments",m.tourneyId));
                    if(tSnap.exists()) {
                        const t = tSnap.data();
                        let creds = t.roomId ? `<div style="background:rgba(16,185,129,0.1); color:var(--success); padding:5px; border-radius:5px; margin-top:5px; border:1px dashed var(--success);">ID: ${t.roomId} | PASS: ${t.password}</div>` : "<div style='color:#94a3b8; margin-top:5px;'>Credentials coming soon</div>";
                        $('my-matches-list').innerHTML += `<div class="t-card"><div class="t-body"><div class="t-title" style="color:var(--primary);">${t.title}</div>${creds}</div></div>`;
                    }
                });
            });
        }

        // --- SPIN & WITHDRAW ---
        window.spinWheel = async() => {
            const amt = parseInt($('spin-amt').value);
            if(!amt || amt > currentUser.balance) return alert("Invalid Amount or Low Balance");
            await updateDoc(doc(db,"users",auth.currentUser.uid), {balance: increment(-amt)});
            const deg = Math.floor(5000 + Math.random() * 5000);
            $('spin-wheel').style.transform = `rotate(${deg}deg)`;
            setTimeout(()=>alert("Good luck next time!"), 4000);
        };

        window.doWithdraw = async() => {
            const amt = parseInt($('w-amt').value);
            if(!amt || amt > currentUser.balance) return alert("Invalid Amount or Low Balance");
            await addDoc(collection(db,"withdrawals"), {userId:auth.currentUser.uid, amount:amt, method:$('w-method').value, number:$('w-num').value, status:"pending"});
            await updateDoc(doc(db,"users",auth.currentUser.uid), {balance: increment(-amt)});
            alert("Request Sent");
        };

        window.updateProfilePic = async() => {
            const u = $('new-pic-url').value;
            if(u) await setDoc(doc(db,"users",auth.currentUser.uid), {photoURL: u}, {merge:true});
            alert("Updated");
        };
        
        window.copyReferCode = () => { navigator.clipboard.writeText(currentUser.referralCode); alert("Copied"); };
    </script>
</body>
</html>
